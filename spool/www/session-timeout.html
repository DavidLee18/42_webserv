<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Timeout Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            text-align: center;
        }

        .session-info {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 8px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .info-label {
            font-weight: 600;
            color: #555;
        }

        .info-value {
            color: #333;
            font-family: 'Courier New', monospace;
        }

        .timer-section {
            margin-top: 30px;
        }

        .timer-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 500;
        }

        .timer-display {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .timer-box {
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px 20px;
            text-align: center;
            min-width: 80px;
        }

        .timer-box.warning {
            background: #fff3cd;
            border-color: #ffc107;
            color: #856404;
        }

        .timer-box.danger {
            background: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }

        .timer-number {
            font-size: 32px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            line-height: 1;
        }

        .timer-unit {
            font-size: 12px;
            margin-top: 5px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .progress-fill.warning {
            background: linear-gradient(90deg, #ffc107, #ff9800);
        }

        .progress-fill.danger {
            background: linear-gradient(90deg, #f5365c, #ec250d);
        }

        .status {
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        .status.active {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.expired {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-refresh {
            background: #667eea;
            color: white;
        }

        .btn-refresh:hover {
            background: #5568d3;
        }

        .btn-home {
            background: #e9ecef;
            color: #333;
        }

        .btn-home:hover {
            background: #dee2e6;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
            text-align: center;
        }

        .loading {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Session Timeout Dashboard</h1>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Loading session information...</p>
        </div>

        <div id="content" style="display: none;">
            <div id="errorMessage"></div>

            <div class="session-info">
                <div class="info-row">
                    <span class="info-label">User ID:</span>
                    <span class="info-value" id="userId">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Time Logged In:</span>
                    <span class="info-value" id="loginTime">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Last Activity:</span>
                    <span class="info-value" id="lastActivity">-</span>
                </div>
            </div>

            <div class="timer-section">
                <div class="timer-label">Time Remaining Until Timeout</div>
                <div class="timer-display">
                    <div class="timer-box" id="minutesBox">
                        <div class="timer-number" id="minutes">0</div>
                        <div class="timer-unit">Minutes</div>
                    </div>
                    <div class="timer-box" id="secondsBox">
                        <div class="timer-number" id="seconds">0</div>
                        <div class="timer-unit">Seconds</div>
                    </div>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 100%;">
                        <span id="progressText">100%</span>
                    </div>
                </div>

                <div class="status active" id="status">
                    ✓ Session Active
                </div>
            </div>

            <div class="button-group">
                <button class="btn-refresh" onclick="refreshData()">Refresh</button>
                <button class="btn-home" onclick="window.location.href='/'">Back to Home</button>
            </div>
        </div>
    </div>

    <script>
        const SESSION_TIMEOUT_SECONDS = 300; // 5 minutes from config ...300

        async function fetchSessionInfo() {
            try {
                const cookies = document.cookie.split(';');
                const sessionCookie = cookies.find(c => c.trim().startsWith('session_id='));

                if (!sessionCookie) {
                    showError('No active session. Please log in first.');
                    return;
                }

                const sessionId = sessionCookie.split('=')[1].trim();

                // Since we don't have a dedicated API endpoint yet,
                // we'll simulate the data from the browser side
                // In production, this should fetch from /api/session-info
                display(sessionId);
            } catch (error) {
                showError('Error fetching session information: ' + error.message);
            }
        }

        function display(sessionId) {
            showContent();

            // Display session ID and simulate time tracking
            document.getElementById('userId').textContent = 'Anonymous (Session: ' + sessionId.substring(0, 8) + '...)';

            const now = new Date();
            document.getElementById('lastActivity').textContent = now.toLocaleTimeString();

            // Start real-time countdown
            updateTimer();
            setInterval(updateTimer, 1000);
        }

        function updateTimer() {
            // This is a client-side simulation
            // In production, server should provide actual remaining time
            const remainingSeconds = SESSION_TIMEOUT_SECONDS - (Math.floor(Date.now() / 1000) % SESSION_TIMEOUT_SECONDS);

            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;

            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');

            const percentage = (remainingSeconds / SESSION_TIMEOUT_SECONDS) * 100;
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');

            progressFill.style.width = percentage + '%';
            progressText.textContent = Math.round(percentage) + '%';

            // Update styling based on remaining time
            const minutesBox = document.getElementById('minutesBox');
            const secondsBox = document.getElementById('secondsBox');
            const status = document.getElementById('status');

            if (remainingSeconds <= 30) {
                progressFill.className = 'progress-fill danger';
                minutesBox.className = 'timer-box danger';
                secondsBox.className = 'timer-box danger';
                status.className = 'status expired';
                status.textContent = '⚠ Session Expiring Soon';
            } else if (remainingSeconds <= 60) {
                progressFill.className = 'progress-fill warning';
                minutesBox.className = 'timer-box warning';
                secondsBox.className = 'timer-box warning';
                status.className = 'status active';
                status.textContent = '⚠ Session Expiring';
            } else {
                progressFill.className = 'progress-fill';
                minutesBox.className = 'timer-box';
                secondsBox.className = 'timer-box';
                status.className = 'status active';
                status.textContent = '✓ Session Active';
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.className = 'error-message';
            showContent();
        }

        function showContent() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        }

        function refreshData() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('content').style.display = 'none';
            setTimeout(fetchSessionInfo, 500);
        }

        // Load on page load
        window.addEventListener('load', fetchSessionInfo);
    </script>
</body>
</html>
